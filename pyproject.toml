[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eudis-swarm"
version = "0.3.0a0"
description = "Deterministic resilience and communication-topology simulation for a multi-UAV swarm"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "n0711" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyright>=1.1.400,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]
visualization = ["matplotlib>=3.8"]
dashboard = [
    "plotly>=5.24,<7",
    "streamlit>=1.40,<2",
]

[project.scripts]
eudis-swarm = "eudis_swarm.simulation:main"
eudis-swarm-dashboard = "eudis_swarm.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["eudis_swarm"]
omit = [
    "src/eudis_swarm/dashboard.py",
    "src/eudis_swarm/dashboard_app.py",
    "src/eudis_swarm/visualization.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
