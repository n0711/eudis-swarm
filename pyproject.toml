[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eudis-swarm"
version = "0.3.0a0"
description = "Deterministic resilience and communication-topology simulation for a multi-UAV swarm"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Charalampos Nadiotis", email = "charalamposnadiotis44@gmail.com" }]
keywords = [
    "swarm",
    "uav",
    "multi-agent",
    "task-allocation",
    "communications-aware",
    "resilience",
    "simulation",
    "defence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/n0711/eudis-swarm"
Repository = "https://github.com/n0711/eudis-swarm"
Issues = "https://github.com/n0711/eudis-swarm/issues"
Changelog = "https://github.com/n0711/eudis-swarm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyright>=1.1.400,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]
visualization = ["matplotlib>=3.8"]
dashboard = [
    "plotly>=5.24,<7",
    "streamlit>=1.40,<2",
]

[project.scripts]
eudis-swarm = "eudis_swarm.simulation:main"
eudis-swarm-dashboard = "eudis_swarm.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["eudis_swarm"]
omit = [
    "src/eudis_swarm/dashboard.py",
    "src/eudis_swarm/dashboard_app.py",
    "src/eudis_swarm/visualization.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
