name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install package and development tools
        run: .venv/bin/python -m pip install -e ".[dev,visualization]"
      - name: Ruff lint
        run: .venv/bin/python -m ruff check .
      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check .
      - name: Pyright
        run: .venv/bin/python -m pyright
      - name: Tests and coverage
        run: .venv/bin/python -m pytest --cov=eudis_swarm --cov-report=term-missing
      - name: Build distribution
        run: .venv/bin/python -m build
      - name: Install wheel and smoke-test CLI
        run: |
          .venv/bin/python -m pip install --force-reinstall dist/*.whl
          .venv/bin/eudis-swarm --help
