name: Correctness or bug report
description: A simulation result that is wrong, non-reproducible, or a crash
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This simulator is deterministic: the same command line must always
        produce the same numbers. If it does not, that is exactly the kind of
        defect worth reporting.

  - type: textarea
    id: command
    attributes:
      label: Exact command line
      description: The full command, including every flag and the seed.
      render: console
      placeholder: python -m eudis_swarm.simulation --seed 1 --allocation-policy connectivity
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed output
      description: Paste the relevant metrics block or traceback verbatim.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: >-
        What you expected instead, and where that expectation comes from — a
        README table, a test, or a hand calculation.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `eudis-swarm --version`, or the commit SHA.
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.11.9 on Windows 11"
    validations:
      required: true
